<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삼향동초 교육과정 플랫폼</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__logo">🏫 삼향동초 교육과정 플랫폼</div>
    <div class="header__user">
      <span id="userName" style="color: #ffffff; font-weight: 500;"></span>
      <button id="btnLogout" class="btn btn--secondary view--hidden" style="margin-left: 10px;">로그아웃</button>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar" id="sidebarNav">
      <!-- 사이드바 메뉴 동적 생성 -->
    </aside>

    <main class="main-content">
      <!-- 1. 로그인 화면 -->
      <section id="view-login" class="login-container">
        <div class="login-card">
          <h2>삼향동초 교육과정 플랫폼</h2>
          <p>교직원 계정으로 로그인해주세요.</p>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <input type="email" id="loginEmail" placeholder="학교 이메일">
            <input type="password" id="loginPassword" placeholder="비밀번호">
            <button type="button" id="btnLoginSubmit" class="btn btn--primary">로그인</button>
          </div>
          <div id="loginMessage" style="margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center;"></div>
        </div>
      </section>

      <!-- 2. 대시보드 화면 -->
      <section id="view-dashboard" class="view--hidden">
        <h1 id="pageTitle">대시보드</h1>
        <table id="opsPlanTable" class="data-table">
          <thead>
            <tr>
              <th>번호</th>
              <th>부서/업무명</th>
              <th>담당자</th>
              <th>분과</th>
              <th>상태</th>
              <th>편집</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- 3. 업무 편집 화면 -->
      <section id="view-editor" class="view--hidden">
        <div class="editor-header">
          <h2 id="editorTitle">업무 편집</h2>
          <div>
            <span id="editorSaveStatus"></span>
            <button id="btnSaveEditor" class="btn btn--primary">저장하기</button>
          </div>
        </div>
        <div id="editorArea" contenteditable="true" class="editor-content"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
