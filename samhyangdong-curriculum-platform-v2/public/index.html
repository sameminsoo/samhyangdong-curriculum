<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>삼향동초 2026학년도 교육과정 수립 플랫폼</title>
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- 로그인 화면 -->
  <form id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>삼향동초 교육과정 플랫폼</h1>
      <p>교직원 계정으로 로그인해주세요.</p>
      <input type="email" id="loginEmail" placeholder="학교 이메일" required />
      <input type="password" id="loginPassword" placeholder="비밀번호" required />
      <button type="submit" class="btn btn-primary">로그인</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </form>

  <!-- 메인 앱 -->
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-title">삼향동초 2026학년도 교육과정 수립</div>
      <div class="topbar-right">
        <span id="userBox"></span>
        <button id="btnLogout" class="btn btn-ghost">로그아웃</button>
      </div>
    </header>

    <nav id="sidebarMenu" class="sidebar"></nav>

    <main id="mainView" class="main-view"></main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
